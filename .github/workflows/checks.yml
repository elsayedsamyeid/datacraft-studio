name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Links and issue forms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline: checks every relative link and anchor between the README, guides and site.
      # External links are skipped so a release that isn't published yet can't fail the build.
      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            './**/*.md'
            './docs/**/*.html'
          fail: true

      - name: Validate issue forms
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          failed = False
          for path in sorted(glob.glob(".github/ISSUE_TEMPLATE/*.yml")):
              try:
                  data = yaml.safe_load(open(path, encoding="utf-8"))
                  if path.endswith("config.yml"):
                      assert "contact_links" in data, "missing contact_links"
                  else:
                      for key in ("name", "description", "body"):
                          assert key in data, f"missing {key}"
                  print(f"ok  {path}")
              except Exception as error:
                  failed = True
                  print(f"BAD {path}: {error}")
          sys.exit(1 if failed else 0)
          EOF

      - name: Check release checksums file
        run: |
          for notes in releases/*/SHA256SUMS.txt; do
            grep -Eq '^[0-9a-f]{64} \*DataCraft-Studio-x64-setup\.exe$' "$notes" \
              || { echo "BAD $notes: no setup checksum"; exit 1; }
            echo "ok  $notes"
          done
